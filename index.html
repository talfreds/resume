<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tyler Alfreds - Full Stack Software Engineer. Portfolio featuring web development projects, performance optimization, and interactive visualizations."
    />
    <meta name="theme-color" content="#0e7a65" />

    <!-- Performance: Preconnect to external resources -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
      crossorigin="anonymous"
    />
    <link
      rel="dns-prefetch"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />

    <!-- Security: Content Security Policy -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self';"
    />

    <!-- Security: HSTS (Strict-Transport-Security) -->
    <meta
      http-equiv="Strict-Transport-Security"
      content="max-age=31536000; includeSubDomains"
    />

    <!-- Performance: Preload critical resources -->
    <link rel="preload" as="style" href="/src/styles.css" />

    <title>Tyler Alfreds - Resume</title>

    <!-- Performance: Defer script loading (non-blocking) -->
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
